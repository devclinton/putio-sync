# Example putio-sync configuration file

[download]
# Target directory for downloads
target_directory = "./downloads"

# Number of concurrent download workers
workers = 4

# Buffer size per download stream in MB (default 16)
buffer_size_mb = 16

# Enable resume of interrupted downloads
resume_enabled = true

# A file already at its local path: "resume" (default), "overwrite" or "keep_both"
on_existing = "resume"

# Delete files from Put.io after successful download
delete_after_download = false

# Delete empty folders after downloading all files from them (default: true)
delete_empty_folders = true

# Progress display style: "per-file", "overall", "individual", "rotating", "none"
progress_style = "per-file"

# Sort order for file processing: "by-date", "by-name", "by-extension", "by-size"  
sort_order = "by-date"

# Reverse sort order
reverse_sort = false

# File filtering patterns (glob syntax)
whitelist_patterns = "*.{mkv,mp4,avi,mov}"  # Only download video files
# blacklist_patterns = "*sample* OR *.{exe,zip}"  # Never download samples, executables, archives

# Per-folder rules (see config.example.toml). include / exclude use the same pattern
# language as whitelist_patterns / blacklist_patterns above and override them per folder.
# [[download.rules]]
# path = "Shows"
# preset = "video"
# include = "*.mkv OR *.mp4"
# exclude = "*sample* OR Sample/*"

# Bandwidth limit in bytes per second (optional)
# bandwidth_limit_bytes_per_sec = 10485760  # 10 MB/s limit, all downloads together
# slow_limit_bytes_per_sec = 1048576        # "Slow 1 h" on the Status page

# Bandwidth schedule, in the daemon's local time; the first matching entry wins
# [[download.bandwidth_schedule]]
# days = "daily"            # or weekdays, weekends, mon-fri, sat,sun
# start = "01:00"
# end = "07:00"             # an end before the start runs past midnight
# limit = "unlimited"       # or "paused", or bytes per second

# Download verification: check each download against Put.io's CRC32 (or size)
# verify = true
# verify_max_redownloads = 2            # 0 to 5; then the download fails
# verify_read_limit_mb_per_sec = 50     # "Verify everything" read speed from disk
# verify_follow_bandwidth_pause = true  # a run waits while downloads are paused

# Maximum retry attempts for failed downloads
max_retries = 3

# Initial retry delay in seconds (doubles with each retry)
retry_initial_delay_secs = 1

[watch]
# Enable torrent file watching
enabled = true

# Directories to watch for .torrent and .magnet files
paths = ["./watch", "./torrents"]

# Seconds between scans. The daemon ignores this and scans every --watch-interval
# seconds (default 60); only `server --watch` reads it.
refresh_cycle = 30

# Parent folder ID on Put.io for uploads (0 = root)
parent_folder_id = 0

# Post-processing options (choose one)
delete_after_upload = true
# archive_directory = "./processed"

# Event hooks: run a command or call a webhook on events (see EVENTS.md)
# [[hooks]]
# name = "on-download"
# events = ["download.finished"]
# command = ["/config/hooks/on-download.py"]
# timeout_secs = 30

# Plugins: bundled ntfy, discord, telegram and pushover notifiers and plex, jellyfin
# and emby library refresh (see PLUGINS.md)
# [[plugins]]
# name = "ntfy"
# enabled = true
# approved_hosts = ["ntfy.sh"]
# [plugins.config]
# topic = "my-nas-8f3k"
#
# [[plugins]]                      # sign in from Settings › Plugins › plex
# name = "plex"
# enabled = true
# [plugins.config]
# server = "http://192.168.1.10:32400"
# path_map = [{ from = "/downloads", to = "/data/media" }]

# The plugin registry (feature 059): Settings > Plugins > More plugins lists its reviewed
# plugins. Nothing is fetched while it is off.
# [plugin_registry]
# enabled = true
# url = "https://raw.githubusercontent.com/devclinton/putio-sync-plugin-registry/main/index.json"
