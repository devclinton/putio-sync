[package]
name = "putio-sync-subtitles"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Subtitles for putio-sync - Put.io subtitle selection, SRT conversion and Whisper-style transcription"

[dependencies]
putio-sync-client = { path = "../putio-sync-client" }
putio-sync-core = { path = "../putio-sync-core" }
putio-sync-telemetry = { path = "../putio-sync-telemetry" }

tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# Non-UTF-8 subtitle files (already in Cargo.lock through reqwest)
encoding_rs = "0.8"

[dev-dependencies]
tempfile = "3.8"
mockito = "1.2"
