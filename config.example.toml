# putio-sync Configuration Example
#
# This is an example configuration file for putio-sync.
# Copy this file to ~/.putiosync/config.toml and customize it for your needs.
#
# You can also specify a custom config location using:
# - Environment variable: PUTIO_SYNC_CONFIG=/path/to/config.toml
# - CLI flag: --config /path/to/config.toml

# ============================================================================
# Authentication Configuration
# ============================================================================
[auth]
# Authentication method to use with Put.io
# Options: "Token" (OAuth) or "AppPassword" (Basic Auth)
# Default: "Token"
auth_method = "Token"

# OAuth token (required when auth_method = "Token")
# Get your token from: https://app.put.io/settings/account
# Run `putio-sync login` to authenticate via OAuth
token = "YOUR_OAUTH_TOKEN_HERE"

# Username/email (required when auth_method = "AppPassword")
# username = "your.email@example.com"

# App-specific password (required when auth_method = "AppPassword")
# Create at: https://app.put.io/account/app-specific-passwords
# password = "YOUR_APP_PASSWORD_HERE"

# ============================================================================
# Sync Configuration
# ============================================================================
[sync]
# Local directory where files will be synced
# Supports home directory expansion: ~/Downloads/putio
# Default: "./putio-downloads"
local_path = "~/Downloads/putio"

# Remote parent folder ID to sync from (0 = root folder)
# Set to a specific folder ID to only sync that folder
# Default: 0
remote_parent_id = 0

# Delete files from Put.io after successful download
# Default: false
delete_after_download = false

# ============================================================================
# Download Configuration
# ============================================================================
[download]
# Number of concurrent download workers
# More workers = faster downloads but higher memory/bandwidth usage
# Recommended: 2-4 for most users
# Default: 2
workers = 2

# Target directory for downloads (can be different from sync.local_path)
# Default: "./putio-downloads"
target_directory = "~/Downloads/putio"

# Buffer size in MB for streaming downloads
# Larger buffer = fewer disk writes but more memory usage
# Recommended: 8-32 MB
# Default: 16
buffer_size_mb = 16

# Chunk size in MB for chunked downloads (set to enable chunking)
# When enabled, large files are split into chunks for parallel download
# Example: 256 MB chunks for files larger than 256 MB
# Set to null or omit to disable chunking
# Default: null (disabled)
# chunk_size_mb = 256

# Enable resume support for interrupted downloads
# When enabled, downloads can be resumed if interrupted
# Default: true
resume_enabled = true

# Skip files that have already been downloaded (based on database)
# Useful for avoiding duplicate downloads
# Default: false
skip_existing = false

# Delete files from Put.io after successful download
# Note: This is specific to the download command
# Default: false
delete_after_download = false

# Progress bar display style
# Options: "per-file", "overall", "individual", "rotating", "none"
# - per-file: Show progress for each file + overall progress
# - overall: Show only overall progress
# - individual: Show only individual file progress
# - rotating: Rotate between files and overall
# - none: No progress bars (useful for logging)
# Default: "per-file"
progress_style = "per-file"

# Sort order for downloads
# Options: "by-date", "by-name", "by-extension", "by-size"
# - by-date: Sort by upload date (newest first)
# - by-name: Sort alphabetically by filename
# - by-extension: Sort by file extension
# - by-size: Sort by file size (largest first)
# Default: "by-date"
sort_order = "by-date"

# Reverse the sort order
# Default: false
reverse_sort = false

# Whitelist file patterns (glob patterns)
# Only download files matching these patterns
# Example: "*.mkv,*.mp4,*.avi" - only download video files
# Set to null or omit to allow all files
# Default: null
# whitelist_patterns = "*.mkv,*.mp4"

# Blacklist file patterns (glob patterns)
# Skip files matching these patterns
# Example: "*.exe,*.msi" - skip executable files
# Set to null or omit to allow all files
# Default: null
# blacklist_patterns = "*.exe,*.bat,*.msi"

# ============================================================================
# Watch Configuration (for torrent file monitoring)
# ============================================================================
[watch]
# How often to refresh in seconds (when filesystem events aren't available)
# Lower values = more responsive but higher CPU usage
# Recommended: 30-120 seconds
# Default: 60
refresh_cycle = 60

# Paths to watch for .torrent files
# When a .torrent file is added to these directories, it will be
# automatically uploaded to Put.io
# Example: ["~/Downloads", "/path/to/torrents"]
# Default: [] (empty - no paths watched)
paths = []

# ============================================================================
# Database Configuration (Advanced)
# ============================================================================
# Database location (SQLite)
# Default: ~/.putiosync/putio-sync.db
# Note: This is automatically managed and usually doesn't need configuration

# ============================================================================
# Examples of Common Configurations
# ============================================================================

# Example 1: Basic setup with OAuth token
# [auth]
# token = "abc123xyz"
# [download]
# target_directory = "~/Downloads/putio"
# workers = 2

# Example 2: High-performance setup with chunking
# [download]
# workers = 4
# chunk_size_mb = 256
# buffer_size_mb = 32
# skip_existing = true

# Example 3: Selective downloads with filtering
# [download]
# whitelist_patterns = "*.mkv,*.mp4,*.avi"
# blacklist_patterns = "*.exe,*.bat"
# sort_order = "by-size"
# reverse_sort = false

# Example 4: Auto-delete setup
# [download]
# delete_after_download = true
# skip_existing = true
# [sync]
# delete_after_download = true

# Example 5: Watch mode for automatic torrent uploads
# [watch]
# refresh_cycle = 30
# paths = ["~/Downloads/torrents", "/Volumes/Media/torrents"]
