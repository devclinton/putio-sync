# putio-sync Configuration Example
#
# This is an example configuration file for putio-sync.
# Copy this file to ~/.putiosync/config.toml and customize it for your needs.
#
# You can also specify a custom config location using:
# - Environment variable: PUTIO_SYNC_CONFIG=/path/to/config.toml
# - CLI flag: --config /path/to/config.toml

# ============================================================================
# Authentication Configuration
# ============================================================================
[auth]
# Authentication method to use with Put.io
# Options: "Token" (OAuth) or "AppPassword" (Basic Auth)
# Default: "Token"
auth_method = "Token"

# OAuth token (required when auth_method = "Token")
# Get your token from: https://app.put.io/settings/account
# Run `putio-sync login` to authenticate via OAuth
token = "YOUR_OAUTH_TOKEN_HERE"

# Username/email (required when auth_method = "AppPassword")
# username = "your.email@example.com"

# App-specific password (required when auth_method = "AppPassword")
# Create at: https://app.put.io/account/app-specific-passwords
# password = "YOUR_APP_PASSWORD_HERE"

# ============================================================================
# Put.io app (feature 013)
# ============================================================================
# The setup wizard and `putio-sync setup` link to Put.io with the device link
# (enter a code at https://put.io/link) when an app ID is known. Releases don't
# carry one yet: register an app at https://app.put.io/oauth (account menu →
# API → Create App) and enter its ID in the web wizard or Settings › Put.io › Put.io,
# which save it here, or set it here yourself. PUTIO_SYNC_APP_ID overrides this
# setting. Without one, setup says so and asks for an app ID or a pasted token.
# [putio]
# app_id = "1234"

# ============================================================================
# Sync Configuration
# ============================================================================
[sync]
# Local directory where files will be synced
# Supports home directory expansion: ~/Downloads/putio
# Default: "./putio-downloads"
local_path = "~/Downloads/putio"

# Remote parent folder ID to sync from (0 = root folder)
# Set to a specific folder ID to only sync that folder
# Default: 0
remote_parent_id = 0

# Delete files from Put.io after successful download
# Default: false
delete_after_download = false

# ============================================================================
# Download Configuration
# ============================================================================
[download]
# Number of concurrent download workers
# More workers = faster downloads but higher memory/bandwidth usage
# Recommended: 2-4 for most users
# Default: 2
workers = 2

# Target directory for downloads (can be different from sync.local_path)
# Default: "./putio-downloads"
target_directory = "~/Downloads/putio"

# Buffer size in MB for streaming downloads
# Larger buffer = fewer disk writes but more memory usage
# Recommended: 8-32 MB
# Default: 16
buffer_size_mb = 16

# Chunk size in MB for chunked downloads (set to enable chunking)
# When enabled, large files are split into chunks for parallel download
# Example: 256 MB chunks for files larger than 256 MB
# Set to null or omit to disable chunking
# Default: null (disabled)
# chunk_size_mb = 256

# Continue interrupted and partial downloads instead of starting over.
# --no-resume turns it off for one `download` run.
# Default: true
resume_enabled = true

# What to do when a file already exists at its local path and the download history
# does not list it as done:
#   resume     skip complete files, continue partial ones (default)
#   overwrite  download again from the start, replace the old file once the new one is complete
#   keep_both  keep the old file, save the new one as "name (1).ext", "name (2).ext", ...
# Complete means same size as on Put.io, and same CRC32 when Put.io has one.
# Radarr/Sonarr download-client items never get a numbered name; they overwrite instead.
# Replaces skip_existing (true = resume, false = overwrite), which is still read.
# Default: "resume"
on_existing = "resume"

# Delete files from Put.io after successful download
# Note: This is specific to the download command
# Default: false
delete_after_download = false

# Progress bar display style
# Options: "per-file", "overall", "individual", "rotating", "none"
# - per-file: Show progress for each file + overall progress
# - overall: Show only overall progress
# - individual: Show only individual file progress
# - rotating: Rotate between files and overall
# - none: No progress bars (useful for logging)
# Default: "per-file"
progress_style = "per-file"

# Sort order for downloads
# Options: "by-date", "by-name", "by-extension", "by-size"
# - by-date: Sort by upload date (newest first)
# - by-name: Sort alphabetically by filename
# - by-extension: Sort by file extension
# - by-size: Sort by file size (largest first)
# Default: "by-date"
sort_order = "by-date"

# Reverse the sort order
# Default: false
reverse_sort = false

# Only download files matching this pattern ("Only download" in Settings).
# Patterns: * any run, ? one character, {a,b} either; OR, | or a comma between
# terms means either, a space or AND means both, - or NOT leaves out. A term
# without * or ? matches anywhere in the name; a term with / matches the path from
# the Put.io root (e.g. "Sample/*"). Case never matters; brackets are literal.
# Folder rules override it with include. Omit to allow all files.
# whitelist_patterns = "*.mkv,*.mp4"           # same as "*.{mkv,mp4}" or "*.mkv OR *.mp4"

# Never download files matching this pattern ("Never download" in Settings).
# Folder rules override it with exclude. Omit to block nothing by name.
# blacklist_patterns = "*sample* OR *.exe"

# File extensions (without dot, case-insensitive) that are never downloaded.
# Omit to use the default list; set [] to disable the guard.
blocked_extensions = ["exe", "msi", "bat", "cmd", "com", "scr", "pif", "vbs",
                      "js", "jar", "ps1", "lnk", "apk", "dmg", "pkg"]

# What to download for the whole account: a preset name (video, audio, ebooks,
# no-binaries, everything, or your own below). Folder rules can still set their
# own. Unset downloads everything except blocked_extensions. Setup sets this.
# preset = "video"

# ----------------------------------------------------------------------------
# Folder rules (feature 009)
# ----------------------------------------------------------------------------
# A rule applies to a folder, given as a path relative to the Put.io root (the
# same path the files get under target_directory), and to everything below it.
# Every setting is optional; for each one the deepest rule that sets it wins, and
# settings no rule sets come from this [download] section. The type filter starts
# from blocked_extensions at the root: a rule's preset replaces the inherited
# filter, then its allow/block extensions are added.
#
#   preset                 video, audio, ebooks, no-binaries, everything, or your own
#   allow / block          extra extensions on top of the preset
#   include / exclude      Only / Never download patterns, as above; "" clears
#                          an inherited one. Checked before the type filter.
#   skip                   download nothing in this folder
#   delete_blocked         delete files the rule blocks from Put.io (one call per sync)
#   delete_after_download  / on_existing: override the settings above
#                          (an old rule's skip_existing is still read)
#
# The web UI sets rules from the Put.io page and previews them before saving.
#
# [[download.rules]]
# path = "Shows"
# preset = "video"
# allow = ["srt"]
#
# exclude = "*sample* OR Sample/*"
#
# [[download.rules]]
# path = "Shows/Old"
# skip = true
#
# [[download.rules]]
# path = "Books"
# preset = "ebooks"
# delete_blocked = true

# Presets: your own, or a built-in name to change its list. Set either `only`
# (an allow list) or `block` (everything except these).
# [download.presets.comics]
# only = ["cbz", "cbr"]

# Bandwidth limit in bytes per second
# Limits download speed to prevent overwhelming the network
# Examples:
#   - 1048576 = 1 MB/s
#   - 5242880 = 5 MB/s
#   - 10485760 = 10 MB/s
# Set to null or omit for unlimited bandwidth
# Default: null (unlimited)
# bandwidth_limit_bytes_per_sec = 5242880
# This is the total for all downloads, and the limit outside the schedule below.

# "Slow 1 h" on the Status page drops to this (or the schedule's limit, if lower)
# Default: 1048576 (1 MB/s)
# slow_limit_bytes_per_sec = 1048576

# Bandwidth schedule: limits by time of day and day of week, in the daemon's local
# time (in Docker set TZ, otherwise UTC). The first entry containing the time wins.
# days: daily, weekdays, weekends, mon, mon-fri, fri-mon, sat,sun
# start 00:00-23:59, end 00:01-24:00; an end before the start runs past midnight
# limit: "unlimited", "paused" or bytes per second
# [[download.bandwidth_schedule]]
# days = "daily"
# start = "01:00"
# end = "07:00"
# limit = "unlimited"
#
# [[download.bandwidth_schedule]]
# days = "mon-fri"
# start = "18:00"
# end = "23:00"
# limit = "paused"

# Download verification (each new download is checked before it gets its real name)
# verify: compare with Put.io's CRC32, or the size where Put.io has none. Default: true
# verify = true
# verify_max_redownloads: downloads again after a mismatch, 0 to 5; then the download
# fails with reason "integrity". Default: 2
# verify_max_redownloads = 2
# verify_read_limit_mb_per_sec: how fast "Verify everything" reads files from disk,
# 1 to 10000 (MB is 1 000 000 bytes). Default: 50
# verify_read_limit_mb_per_sec = 50
# verify_follow_bandwidth_pause: a verify run waits while the bandwidth schedule or
# "Pause 1 h" pauses downloads. Default: true
# verify_follow_bandwidth_pause = true

# Maximum number of retry attempts for failed downloads
# When a download fails, it will be retried with exponential backoff
# Example: 3 retries with 1s initial delay = 1s, 2s, 4s delays
# Default: 3
max_retries = 3

# Initial retry delay in seconds (doubles with each retry)
# The delay between retries follows exponential backoff
# Example: 1 second initial delay results in 1s, 2s, 4s, 8s...
# Default: 1
retry_initial_delay_secs = 1

# ============================================================================
# Watch Configuration (for torrent file monitoring)
# ============================================================================
[watch]
# How often to refresh in seconds (when filesystem events aren't available)
# Lower values = more responsive but higher CPU usage
# Recommended: 30-120 seconds
# Default: 60
refresh_cycle = 60

# Paths to watch for .torrent files
# When a .torrent file is added to these directories, it will be
# automatically uploaded to Put.io
# Example: ["~/Downloads", "/path/to/torrents"]
# Default: [] (empty - no paths watched)
paths = []

# Move each uploaded .torrent/.magnet file into this folder (created if
# missing; ~ is expanded). Takes precedence over delete_after_upload. The daemon
# reads it at startup, and a save from the web UI applies it at the next scan.
# Default: unset (files stay, tracked in the database, or are deleted with
# delete_after_upload = true)
# archive_directory = "~/processed"

# ============================================================================
# Put.io Empty-Folder Cleanup
# ============================================================================
# Removes empty folders from your Put.io account, deepest first: a folder that
# holds only empty folders goes too (see nested below). Never removed: the root, watch.parent_folder_id,
# sync.remote_parent_id, shared folders, and folders unfinished transfers save to.
# Run it by hand any time with `putio-sync files clean-empty` (add --dry-run to
# preview), the API (POST /putio/cleanup/empty-folders) or the web UI's Put.io page.
[cleanup]
# Remove empty folders once a day. Only the `daemon` command runs the daily job,
# and it deletes (there is no dry run for it). Missed runs are not caught up.
# Default: false
enabled = false

# Local time of the daily run, 24-hour "HH:MM". "Local" is the process's time
# zone: set TZ in Docker (e.g. TZ=Europe/London), otherwise it is UTC.
# Default: "03:00"
run_at = "03:00"

# Keep empty folders younger than this many hours, so a folder a new transfer
# just created is not removed. 0 to 8760.
# Default: 24
min_age_hours = 24

# Also remove folders whose sub-folders are all empty (e.g. Show/Season 1/ with
# nothing in Season 1), deepest first, in the same run. With false, only folders
# with nothing at all in them are removed; their parents go on a later run.
# Default: true
nested = true

# ============================================================================
# Put.io Storage (feature 033)
# ============================================================================
# The Put.io page shows the account's storage and what fills it, and warns (as
# do the Status page and the doctor) when free space is below warn_free_percent.
# "Free up space" there, or `putio-sync files free-space` (add --dry-run to only
# preview), deletes the oldest files that are already downloaded, until
# target_free_percent is free. A file qualifies only when its download finished,
# its local copy still exists with the Put.io size, and it is not queued, shared
# or in the folder of an unfinished transfer. You see the list before anything is
# deleted, and every run is listed afterwards (and in History).
[storage]
# Warn when less than this percent of the account is free. 1 to 89.
# Default: 10
warn_free_percent = 10

# A free-up run deletes files until this percent is free. Above
# warn_free_percent, at most 90.
# Default: 20
target_free_percent = 20

# Free up space once a day without asking, when free space is below
# warn_free_percent. Only the `daemon` command runs it.
# Default: false
auto_free = false

# Local time of the daily check, 24-hour "HH:MM" (before the empty-folder
# cleanup, which then removes folders the run left empty).
# Default: "02:30"
run_at = "02:30"

# ============================================================================
# Event hooks (feature 027)
# ============================================================================
# Run a command or call a webhook on events; each gets the event as JSON (stdin
# or the POST body). Types and fields: EVENTS.md. Up to 32 hooks.
# Commands run as the daemon's user with a clean environment.
# [[hooks]]
# name = "on-download"                  # letters, digits, - and _
# events = ["download.finished"]        # or "*" for every type
# command = ["/config/hooks/on-download.py"]   # absolute path, then arguments
# env = { LIBRARY = "/data/media" }     # commands only
# timeout_secs = 30                     # 1 to 600. Default: 30
#
# Webhooks are retried after 5 s and 30 s on errors, timeouts, 429 and 5xx.
# The URL is never logged in full; prefer a header for a token.
# [[hooks]]
# name = "home-assistant"
# events = ["download.finished", "download.failed", "storage.low"]
# url = "https://ha.local:8123/api/webhook/putio"
# headers = { Authorization = "Bearer abc" }   # webhooks only
# timeout_secs = 10
# enabled = false                       # keep it without running it

# ============================================================================
# Processing pipeline (feature 038)
# ============================================================================
# A hook with a `stage` is a step of an item's life, not an event hook: it runs
# when the item reaches that stage, in the order the hooks are listed. It gets
# the item as PUTIO_SYNC_ITEM_* variables and as JSON in the file named by
# PUTIO_SYNC_ITEM_JSON. Exit 0 (or a 2xx) is done; anything else is a failure.
# In pre_download only, exit 10 (or a 2xx with {"action": "skip"}) skips the item.
# Stages: pre_download (holds the Put.io transfer until the hook passes),
# pre_processing and post_processing (after the files are on the NAS).
# A stage hook takes no `events`.
# [[hooks]]
# name = "tidy"
# stage = "post_processing"
# command = ["/config/hooks/tidy.sh"]
# required = true                       # a failure holds the item for you to retry or skip. Default: true
# categories = ["radarr", "sonarr"]     # only for these Arr categories; empty means all
# timeout_secs = 120

[pipeline]
# Items whose steps run at once, 1 to 16. Default: 2
# concurrency = 2
# Seconds to wait before each retry of a failing optional (required = false)
# step; it is given up after the last, and the item ends "with warnings".
# At most 10 entries. Default: [60, 300, 600]
# optional_retries = [60, 300, 600]
# Keep a watch-folder download out of sight (in .putio-sync-staging beside it)
# until its steps are done: "auto" (on while a stage hook exists), "on" or "off"
# staging = "auto"

# ============================================================================
# Lua plugins (feature 028)
# ============================================================================
# Sandboxed Lua scripts run on the same events as hooks. ntfy, discord,
# telegram and pushover notifiers and plex, jellyfin and emby library refresh
# (feature 031) are bundled; your own go in a folder each under
# plugins_dir. Settings › Plugins edits these and approves hosts. PLUGINS.md
# has the details.
# A top-level key: set it above the first [section] of this file.
# plugins_dir = "/config/plugins"       # Default: "plugins" next to this file
# [[plugins]]
# name = "ntfy"
# enabled = true                        # Default: false
# approved_hosts = ["ntfy.sh"]          # hosts it may call; Settings writes these
# timeout_secs = 10                     # per call, 1 to 60. Default: 10
# memory_mb = 32                        # 4 to 256. Default: 32
# [plugins.config]
# topic = "my-nas-8f3k"
# group_minutes = 5                     # repeats within this time are summed up
# [plugins.secrets]                     # masked in Settings and the export
# token = "tk_..."
#
# Plex: rescan the folder of each finished download (feature 031). Sign in
# with Plex in Settings saves the token; Jellyfin and Emby take an api_key.
# [[plugins]]
# name = "plex"
# enabled = true
# approved_hosts = ["plex.tv", "192.168.1.10"]
# [plugins.config]
# server = "http://192.168.1.10:32400"
# libraries = ["1", "2"]                # section keys (Jellyfin/Emby: names); none = any
# path_map = [{ from = "/downloads", to = "/data/media" }]   # this machine => server
# delay_seconds = 20                    # wait for more files, 0 to 600. Default: 20
# max_wait_seconds = 300                # longest wait, 10 to 3600. Default: 300

# ============================================================================
# Tailscale (feature 036)
# ============================================================================
# putio-sync reads Tailscale's state through tailscaled's local socket (or the
# `tailscale` CLI) and never changes the Tailscale setup. In Docker, mount the
# socket: -v /var/run/tailscale:/var/run/tailscale:ro (host Tailscale or a
# sidecar's socket volume). Settings › Network and access › Tailscale shows what was found.
[tailscale]
# Listen only on this node's tailnet IPv4 address instead of [api] bind: the
# same as bind = "tailnet:<port>" for each port in [api] bind. Applies at the
# next start of `daemon` or `server` (unless `server --bind` is given); it
# keeps waiting for Tailscale to come up and never falls back to [api] bind.
# Default: false
tailnet_only = false

# Let in requests from allowed Tailscale users without the API token: through
# `tailscale serve` (identity headers on a loopback connection), or directly
# from a tailnet address that tailscaled says belongs to the user. Tagged
# devices are never let in. The token keeps working.
# Default: false
identity_sign_in = false

# Tailscale logins identity sign-in lets in. Empty lets nobody in.
# Default: []
allowed_users = []

# tailscaled's LocalAPI socket. PUTIO_SYNC_TAILSCALE_SOCKET overrides it.
# Default: "/var/run/tailscale/tailscaled.sock"
# socket = "/var/run/tailscale/tailscaled.sock"

# ============================================================================
# Notification Configuration
# ============================================================================
[notifications]
# Enable/disable notifications
# Default: false
enabled = false

# Notification backend to use
# Options: "none", "webhook", "email"
# - none: No notifications (default)
# - webhook: Send HTTP POST requests to a webhook URL
# - email: Send email notifications (not yet implemented)
# Default: "none"
backend = "none"

# Webhook URL (required when backend = "webhook")
# The webhook will receive a POST request with JSON payload containing:
# - file_id: Put.io file ID
# - filename: Name of the downloaded file
# - file_size: Size in bytes
# - local_path: Local path where file was saved
# - duration_seconds: Download duration
# - average_speed: Average download speed in bytes/sec
# - completed_at: ISO 8601 timestamp
# Example: "https://example.com/webhook/putio"
# webhook_url = "https://your-webhook-url.com/notify"

# Email address for notifications (when backend = "email", future)
# email = "your.email@example.com"

# ============================================================================
# Logging Configuration
# ============================================================================
[logging]
# Log level: trace, debug, info, warn, error
# - trace: Most verbose, includes all debug information
# - debug: Detailed debugging information
# - info: General informational messages (default)
# - warn: Warning messages
# - error: Error messages only
# Changes apply while running (checked every 10 s). RUST_LOG, if set, wins and
# turns off live changes.
# Default: "info"
level = "info"

# Enable file logging (logs written to disk)
# Default: true
file_enabled = true

# Log file path (supports ~ for home directory expansion)
# Logs are automatically rotated daily
# Default: "~/.putiosync/logs/putio-sync.log"
file_path = "~/.putiosync/logs/putio-sync.log"

# Maximum log file size before rotation (in MB)
# Note: Currently daily rotation is used, this is for future size-based rotation
# Default: 10
max_file_size_mb = 10

# Number of rotated log files to keep
# Default: 5
max_backups = 5

# Enable console logging (output to terminal)
# Default: true
console_enabled = true

# Console output format
# Options: "compact", "pretty", "json"
# - compact: Single line per log (default, best for production)
# - pretty: Multi-line format (best for development/debugging)
# - json: Structured JSON format (best for log aggregation)
# Env override: PUTIO_SYNC_LOG_FORMAT. Restart to change.
# Default: "compact"
console_format = "compact"

# Module-specific log filters
# Allows fine-grained control over logging per module
# Examples:
#   - "putio_sync_download=trace" - enable trace logs for download module
#   - "putio_sync_client=debug" - enable debug logs for client module
# Changes apply while running, together with level.
# Default: [] (no module-specific filters)
module_filters = []

# Recent log lines kept in memory for the web UI's Logs page (feature 047), after
# secrets are masked. Only lines the level in effect lets through are kept.
# Changes apply while running. Range: 100 to 50000. Default: 2000
buffer_lines = 2000

# ============================================================================
# Metrics (Prometheus)
# ============================================================================
# Served by both `daemon` and `server`. There is no authentication: anyone who
# can reach the port can read the metrics. They carry no tokens, file names or
# paths. Restart to change any of these. Each has an env override, which wins.
[metrics]
# Env: PUTIO_SYNC_METRICS_ENABLED (true, false, 1, 0). Default: true
enabled = true

# Where to listen: one address or a list, in the same forms as [api] bind
# (ip:port, [ipv6]:port, interface:port, tailnet:port). 0.0.0.0 means all
# IPv4 addresses; in Docker, exposure is decided by which port the container
# publishes. Settings › Network and access › Network can change it.
# Env: PUTIO_SYNC_METRICS_BIND (a comma-separated list). Default: "0.0.0.0:9742"
bind = "0.0.0.0:9742"
# bind = ["127.0.0.1:9742", "tailnet:9742"]

# URL path, must start with "/". Env: PUTIO_SYNC_METRICS_PATH. Default: "/metrics"
path = "/metrics"

# basic or detailed. detailed adds per-worker state and in-flight bytes, and
# per-operation API latency.
# Env: PUTIO_SYNC_METRICS_DETAIL. Default: "basic"
detail = "basic"

# ============================================================================
# Put.io transfers
# ============================================================================
# The daemon checks the Put.io transfer list and flags transfers that stopped
# making progress (often at 97%+, when no peer has the last pieces). Stalled
# transfers get a badge on the web UI's Transfers page and are counted in the
# putio_sync_transfers_stalled metric. Restart to change these.
[transfers]
# Hours a downloading transfer may go without new bytes before it is stalled.
# Default: 6
stall_threshold_hours = 6

# Seconds between checks of the transfer list. Default: 600
stall_check_interval_secs = 600

# Hours a finished transfer stays in the Active page's "Recently finished" list.
# From 1 to 720. Default: 24
finished_retention_hours = 24

# ============================================================================
# Doctor
# ============================================================================
# The doctor checks Put.io, the sync state, the local disk and the config, and
# reports each check as OK, warning or problem (`putio-sync doctor`, the Doctor
# page, and the putio_sync_doctor_* metrics). The daemon runs it on a schedule so
# the metrics stay current; the CLI and the web UI can run it at any time.
[doctor]
# Run the checks on a schedule in the daemon. Default: true
enabled = true

# Minutes between scheduled runs (minimum 5). Default: 60
interval_minutes = 60

# ============================================================================
# API and Web UI
# ============================================================================
# `daemon` serves the JSON API and the web UI on one port (http://<host>:15432/).
# `server` serves the same API and UI on `bind` too, unless its --bind/--port
# flags say otherwise; it ignores `listen`. Plain HTTP: keep the port on a
# trusted LAN. Restart to change any of these. Each has an env override, which
# wins.
[api]
# Bearer token for the web UI and every API route except /health. REQUIRED for
# the UI: without it every request is refused with 401 "API token not
# configured". Must be non-empty with no whitespace; an empty string ("") stops
# putio-sync at startup. Prefer the env variable so the token stays out of this
# file. A settings save from the web UI rewrites this file but keeps the tokens
# it finds here ([auth] and auth_token); an env-only token is never written.
# Env: PUTIO_SYNC_API_TOKEN
# auth_token = "change-me"

# `daemon` only: open the API and web UI listener (true, false, 1, 0). If the
# port can't be bound, one error is logged and the daemon keeps syncing.
# Env: PUTIO_SYNC_API_LISTEN. Default: true
listen = true

# Where to listen: one address or a list. Each entry is one of
#   "0.0.0.0:15432"        an IPv4 address (0.0.0.0 = all IPv4 addresses)
#   "[::]:15432"           an IPv6 address in brackets ([::] = all IPv6)
#   "eth0:15432"           every address the interface has, followed as the
#                          interface's addresses change (DHCP, VPN up/down)
#   "tailnet:15432"        this machine's Tailscale IPv4 address
# An entry with no address now (interface down, Tailscale signed out) waits and
# is checked again; putio-sync never falls back to all addresses. In Docker,
# exposure is decided by which port the container publishes. Settings › Network and access › Network
# can change it and warns before a list that would cut the page off.
# Env: PUTIO_SYNC_API_BIND (a comma-separated list). Default: "0.0.0.0:15432"
bind = "0.0.0.0:15432"
# bind = ["127.0.0.1:15432", "tailnet:15432"]
# bind = ["eth0:15432", "[::1]:15432"]

# Unrelated to the listener: make the daemon hand downloads to a remote API
# server at `url` instead of downloading itself. The daemon's own API and UI
# listener is not started in that mode.
# enabled = false
# url = "http://host:15432"

# ============================================================================
# Radarr / Sonarr download client
# ============================================================================
# putio-sync answers the Transmission RPC, so Radarr and Sonarr can use it as a
# download client. They send magnets and .torrent files; putio-sync adds them to
# Put.io in a folder named after the category, downloads the result to
# <target_directory>/<category>/, and reports progress, completion and failures.
# Needs the API listener ([api] listen) and the database.
#
# This whole section can be edited in the web UI: Settings > Radarr / Sonarr.
# Changes there apply without a restart and keep the rest of this file. "Set up
# automatically" adds the download client inside Radarr or Sonarr for you.
#
# To add it by hand instead, in Radarr or Sonarr: Settings > Download Clients > + > Transmission
#   Host: this machine   Port: 15432 (the API port)   URL Base: /transmission/
#   Username: putio-sync (or `username` below)   Password: `password` below
#   Category: e.g. radarr / sonarr. Its folder is <target_directory>/<category>.
# Remote Path Mappings are only needed when Radarr/Sonarr see the download folder
# under another path (e.g. a different container mount).
#
# The torrent watcher ([watch]) keeps working, so a Torrent Blackhole client can
# stay as a fallback at a lower priority.
[arr]
# Answer /transmission/rpc. Default: false
enabled = false

# Basic auth username the *arr apps send. Default: "putio-sync"
# username = "putio-sync"

# Basic auth password. REQUIRED when enabled: without it every request gets 503.
# Prefer the env variable so it stays out of this file.
# Env: PUTIO_SYNC_ARR_PASSWORD
# password = "change-me"

# Optional: applications putio-sync calls back (Settings > Radarr / Sonarr >
# Applications in the web UI). With one listed, a release that fails (Put.io
# error, or only blocked files) is removed from that app's queue and blocklisted,
# so it searches again. The category is read from the app's own putio-sync
# download client, so it isn't set here.
# API keys: Settings > General in each app. Env PUTIO_SYNC_RADARR_API_KEY and
# PUTIO_SYNC_SONARR_API_KEY set the key of the first server of that kind.
# [[arr.servers]]
# kind = "radarr"
# name = "Radarr"                # Optional. Default: Radarr / Sonarr
# url = "http://192.168.1.10:7878"
# api_key = "..."
#
# [[arr.servers]]
# kind = "sonarr"
# url = "http://192.168.1.10:8989"
#
# `category` from older versions is no longer needed. It still loads, is ignored,
# and the UI warns when it differs from the app's client.

# ============================================================================
# Release check (fake releases)
# ============================================================================
# Before a release reaches Put.io, putio-sync reads its file list and rejects it
# when no file is a wanted type of at least `min_size_mb`, such as a "movie"
# that is only an .exe or a password-protected .7z. This covers .torrent files
# and URLs from Radarr/Sonarr and .torrent and .magnet files in watch folders.
# A rejected *arr item fails with the reason (and is blocklisted with
# [[arr.servers]]); a rejected watch file isn't uploaded and is renamed
# <file>.rejected. The wanted types are a folder rule's allow list ([[download.rules]]
# on the category's or watch folder's Put.io folder), else video.
#
# Magnets have no file list, so their .torrent is looked up in public caches.
# Privacy: only the 40-character info hash is sent to each cache, never the
# name, trackers or your passkey. A magnet that isn't found goes to Put.io, and
# its files are checked there before any reach the NAS.
#
# Settings › Rules and filters › Release check in the web UI edits this section and shows what the
# check does for each category and watch folder. Restart to apply changes.
[precheck]
# Check releases at all. Env: PUTIO_SYNC_PRECHECK_ENABLED. Default: true
enabled = true

# Check, log and count, but never reject or delete anything. Try this first to
# see what would be rejected (History and Stats show it). Default: false
dry_run = false

# The largest wanted file must be at least this big, 0 to 100000. Default: 50
min_size_mb = 50

# Count archives (.rar, .7z, .zip, split parts) as wanted. Default: false
allow_archives = false

# Look magnets up in `caches` before adding them. Off sends every magnet
# straight to Put.io and checks it there.
# Env: PUTIO_SYNC_PRECHECK_MAGNET_LOOKUP. Default: true
magnet_lookup = true

# Total time for all caches per magnet, 1 to 30 seconds. Default: 10
lookup_timeout_secs = 10

# Hold a magnet no cache has yet, up to this many seconds, asking again before
# it goes to Put.io; when the hold runs out it goes unchecked and is checked on
# Put.io. Radarr/Sonarr see it as queued meanwhile. 0 to 3600; 0 turns holding
# off. Asks the same caches, nothing else. Default: 300
hold_magnet_secs = 300

# Seconds between asks while a magnet is held, 10 to 600. Default: 30
hold_retry_secs = 30

# While holding, the first ask's limit in seconds, so Radarr/Sonarr get their
# answer fast. 1 to lookup_timeout_secs. Default: 3
first_lookup_secs = 3

# .torrent caches, tried in order. Each is an http(s) URL with {HASH} (upper
# case) or {hash} (lower case) in place of the info hash.
caches = ["https://itorrents.net/torrent/{HASH}.torrent"]

# Per *arr category (the folder under the download folder). Unset keys come
# from above.
# [precheck.categories.software]
# enabled = false
#
# [precheck.categories.radarr]
# min_size_mb = 300

# Per [watch].paths entry
# [precheck.watch."/watch/tv"]
# min_size_mb = 100

# Checks and reports older than 400 days are deleted at startup and daily.

# ============================================================================
# Database Configuration (Advanced)
# ============================================================================
# Database location (SQLite)
# Default: ~/.putiosync/putio-sync.db
# Note: This is automatically managed and usually doesn't need configuration

# ============================================================================
# Examples of Common Configurations
# ============================================================================

# Example 1: Basic setup with OAuth token
# [auth]
# token = "abc123xyz"
# [download]
# target_directory = "~/Downloads/putio"
# workers = 2

# Example 2: High-performance setup with chunking
# [download]
# workers = 4
# chunk_size_mb = 256
# buffer_size_mb = 32
# on_existing = "resume"

# Example 3: Selective downloads with filtering
# [download]
# whitelist_patterns = "*.mkv,*.mp4,*.avi"
# blacklist_patterns = "*.exe,*.bat"
# sort_order = "by-size"
# reverse_sort = false

# Example 4: Auto-delete setup
# [download]
# delete_after_download = true
# on_existing = "resume"
# [sync]
# delete_after_download = true

# Example 5: Watch mode for automatic torrent uploads
# [watch]
# refresh_cycle = 30
# paths = ["~/Downloads/torrents", "/Volumes/Media/torrents"]
