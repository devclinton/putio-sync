[package]
name = "rust-clean-names"
version = "1.0.0"
edition = "2021"
publish = false

# Not part of the putio-sync workspace: it builds for wasm32-unknown-unknown
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
