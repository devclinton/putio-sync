name = "batch-digest"
version = "0.1.0"
description = "Group finished downloads into one digest per sync run, and lose none on a reload"
events = ["download.finished", "sync.completed"]

[permissions]
store = true

[[config]]
key = "max"
type = "integer"
label = "Largest digest"
help = "A digest is written as soon as it holds this many downloads"
default = 20
