name = "min-size-filter"
version = "1.0.0"
description = "Skip videos smaller than a size, such as samples, trailers and extras"
hooks = ["filter"]

[[config]]
key = "min_mb"
type = "integer"
label = "Smallest video (MB)"
help = "Videos below this are not downloaded"
default = 50

[[config]]
key = "extensions"
type = "string_list"
label = "Video extensions"
default = ["mkv", "mp4", "avi", "m4v", "mov", "wmv", "ts"]
