[package]
name = "putio-sync-telemetry"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Prometheus metrics for putio-sync"

[dependencies]
# Metrics registry and text encoding
prometheus = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Metrics HTTP listener
axum = "0.7"

# Logging
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Disk space (statvfs) and clock ticks for process CPU time
rustix = { version = "1", features = ["fs", "param"] }

[target.'cfg(windows)'.dependencies]
# Disk space (GetDiskFreeSpaceExW)
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
reqwest = { workspace = true }
tempfile = "3.8"
tracing-subscriber = { workspace = true }
