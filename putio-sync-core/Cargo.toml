[package]
name = "putio-sync-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core shared utilities for putio-sync - configuration, filtering, and common utilities"

[dependencies]
# Metrics
putio-sync-telemetry = { path = "../putio-sync-telemetry" }

# Internal dependencies
putio-sync-client = { path = "../putio-sync-client" }

# Async runtime
tokio = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# Edits config.toml in place, keeping comments (same version `toml` pulls in)
toml_edit = "0.22"

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# Database
sqlx = { workspace = true }

# Utilities
dirs = { workspace = true }
glob = "0.3"
base64 = "0.22"
futures-util = "0.3"
sha2 = "0.10"
chrono = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
mockito = "1.2"
tempfile = "3.8"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
