[package]
name = "putio-sync-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI application for putio-sync"

[lib]
name = "putio_sync_cli"
path = "src/lib.rs"

[[bin]]
name = "putio-sync"
path = "src/main.rs"

[dependencies]
# Core library
putio-sync-core = { path = "../putio-sync-core" }

# Async runtime
tokio = { workspace = true }

# CLI
clap = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Terminal detection
atty = "0.2"

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"
assert_fs = "1.1"
