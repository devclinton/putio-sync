[package]
name = "putio-sync-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI application for putio-sync"

[lib]
name = "putio_sync_cli"
path = "src/lib.rs"

[[bin]]
name = "putio-sync"
path = "src/main.rs"

[dependencies]
# Metrics
putio-sync-telemetry = { path = "../putio-sync-telemetry" }

# Core library (for Config and utilities)
putio-sync-core = { path = "../putio-sync-core" }
putio-sync-api = { path = "../putio-sync-api" }
putio-sync-archive = { path = "../putio-sync-archive" }
putio-sync-tailscale = { path = "../putio-sync-tailscale" }

# Specialized crates
putio-sync-client = { path = "../putio-sync-client" }
putio-sync-db = { path = "../putio-sync-db" }
putio-sync-download = { path = "../putio-sync-download" }
putio-sync-file-manager = { path = "../putio-sync-file-manager" }
putio-sync-daemon = { path = "../putio-sync-daemon" }
putio-sync-dlna = { path = "../putio-sync-dlna" }
putio-sync-doctor = { path = "../putio-sync-doctor" }
putio-sync-hooks = { path = "../putio-sync-hooks" }
putio-sync-notify = { path = "../putio-sync-notify" }
putio-sync-pipeline = { path = "../putio-sync-pipeline" }
putio-sync-plugins = { path = "../putio-sync-plugins" }
putio-sync-storage = { path = "../putio-sync-storage" }

# Async runtime
tokio = { workspace = true }
futures = "0.3"

# CLI
clap = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Terminal detection
atty = "0.2"

# Browser opening
open = "5.0"

# OAuth 2.0
oauth2 = "4.4"

# Environment variables
dotenvy = "0.15"

# HTTP server for OAuth callback
axum = "0.7"

# URL parsing
url = "2.5"

# HTTP client
reqwest = { workspace = true }

# URL encoding
urlencoding = "2.1"

# Progress bars
indicatif = "0.17"

# Signal handling
ctrlc = "3.4"

# Date/time handling
chrono = "0.4"

# Filesystem watching

# System information
sysinfo = { workspace = true }

# Reading the Put.io token without echo
rpassword = "7.5"

[dev-dependencies]
tempfile = "3.8"
tokio = { workspace = true, features = ["test-util"] }
assert_cmd = "2.0"
predicates = "3.0"
assert_fs = "1.1"
mockito = "1.2"
flate2 = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
