name: Build and Publish Snap

# Pushes to main go to the edge channel, releases to stable. Publishing needs the
# SNAPCRAFT_TOKEN secret (`snapcraft export-login`); without it the snap is only
# built, tested and uploaded as an artifact.
on:
  push:
    branches: [main]
    paths:
      - 'putio-sync-*/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'config.example.toml'
      - 'snap/**'
      - '.github/workflows/snap.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Snap Store channel (edge, beta, candidate, stable)'
        required: true
        default: 'edge'
      version:
        description: 'Version to build (e.g., v0.1.1); default is the Cargo version plus the commit'
        required: false

jobs:
  build-snap:
    name: Build Snap Package
    runs-on: ubuntu-latest
    outputs:
      snap_file: ${{ steps.snap_file.outputs.snap_file }}
    env:
      HAS_STORE_TOKEN: ${{ secrets.SNAPCRAFT_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          case "${{ github.event_name }}" in
            release)
              VERSION="${{ github.event.release.tag_name }}"
              CHANNEL="stable"
              ;;
            workflow_dispatch)
              VERSION="${{ github.event.inputs.version }}"
              CHANNEL="${{ github.event.inputs.channel }}"
              ;;
            *)
              VERSION=""
              CHANNEL="edge"
              ;;
          esac
          # Snap versions allow 32 characters: 0.1.1+git1a2b3c4 for untagged builds
          if [ -z "$VERSION" ]; then
            VERSION="${CARGO_VERSION}+git$(git rev-parse --short=7 HEAD)"
          fi
          VERSION_NO_V=${VERSION#v}
          echo "version=${VERSION_NO_V}" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT

      - name: Update snap version
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          sed -i "s/^version: .*/version: '${VERSION}'/" snap/snapcraft.yaml
          grep "^version:" snap/snapcraft.yaml

      - name: Build snap
        uses: snapcore/action-build@v1
        id: build

      - name: Get snap filename
        id: snap_file
        run: |
          SNAP_FILE=$(basename "${{ steps.build.outputs.snap }}")
          echo "snap_file=${SNAP_FILE}" >> $GITHUB_OUTPUT
          echo "Built snap: ${SNAP_FILE}"

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap-package
          path: ${{ steps.build.outputs.snap }}

      - name: Publish to Snap Store
        if: env.HAS_STORE_TOKEN == 'true'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ steps.get_version.outputs.channel }}

      - name: Create summary
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          CHANNEL="${{ steps.get_version.outputs.channel }}"
          {
            echo "## Snap Package Built"
            echo ""
            echo "- **Version**: ${VERSION}"
            echo "- **File**: ${{ steps.snap_file.outputs.snap_file }}"
            echo "- **Channel**: ${CHANNEL}"
            echo ""
            if [ "$HAS_STORE_TOKEN" = "true" ]; then
              echo "Published to the **${CHANNEL}** channel:"
              echo ""
              echo '```bash'
              if [ "${CHANNEL}" = "stable" ]; then
                echo "sudo snap install putio-sync"
              else
                echo "sudo snap install putio-sync --${CHANNEL}"
              fi
              echo '```'
            else
              echo "Not published: the SNAPCRAFT_TOKEN secret is not set. The snap is attached as an artifact."
            fi
            echo ""
            bash scripts/build-notes.sh "${{ github.event_name == 'release' && steps.get_version.outputs.version || '' }}"
          } >> $GITHUB_STEP_SUMMARY

  test-snap:
    name: Test Snap Installation
    needs: build-snap
    runs-on: ubuntu-latest
    steps:
      - name: Download snap artifact
        uses: actions/download-artifact@v4
        with:
          name: snap-package

      - name: Install snap
        run: sudo snap install --dangerous "${{ needs.build-snap.outputs.snap_file }}"

      - name: Test the CLI
        run: |
          putio-sync --version
          snap info --verbose putio-sync || true
          snap connections putio-sync
          # The daemon stays off until the user enables it
          snap services putio-sync.daemon | grep -q "disabled"

      - name: Test the daemon service
        run: |
          # Running the CLI with sudo writes the starter config; a placeholder
          # Put.io token lets the daemon start without logging in
          sudo putio-sync --version
          config=/var/snap/putio-sync/common/config.toml
          sudo test -f "$config"
          sudo sed -i 's|^# token = "YOUR_OAUTH_TOKEN_HERE"|token = "ci-placeholder"|' "$config"

          sudo snap set putio-sync api-token=ci-api-token
          sudo snap start --enable putio-sync.daemon

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:15432/health; then
              echo
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:15432/health > /dev/null
          # The web UI token from `snap set` is in force
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:15432/settings/download)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-api-token' http://127.0.0.1:15432/settings/download)" = 200

      - name: Daemon logs
        if: always()
        run: sudo snap logs -n 100 putio-sync.daemon || true

      - name: Uninstall snap
        if: always()
        run: sudo snap remove --purge putio-sync || true
