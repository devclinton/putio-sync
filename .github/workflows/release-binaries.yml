name: Build Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v0.1.1)'
        required: true

jobs:
  build-windows:
    name: Build Windows ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Get version
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $version = "${{ github.event.release.tag_name }}"
          } else {
            $version = "${{ github.event.inputs.version }}"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "version_no_v=$($version -replace '^v', '')" >> $env:GITHUB_OUTPUT

      - name: Build binary
        shell: pwsh
        run: |
          cargo build --release --target ${{ matrix.target }} --package putio-sync-cli

          # Verify the binary was created
          $binaryPath = "target/${{ matrix.target }}/release/putio-sync.exe"
          if (!(Test-Path $binaryPath)) {
            Write-Error "Binary not found at $binaryPath"
            exit 1
          }

      - name: Create archive
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.version }}"
          $archiveName = "putio-sync-$version-${{ matrix.target }}.zip"

          # Create archive directory
          New-Item -ItemType Directory -Path "archive" -Force

          # Copy binary
          Copy-Item "target/${{ matrix.target }}/release/putio-sync.exe" -Destination "archive/"

          # Copy additional files
          Copy-Item "README.md" -Destination "archive/" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" -Destination "archive/" -ErrorAction SilentlyContinue

          # Create ZIP archive
          Compress-Archive -Path "archive/*" -DestinationPath $archiveName

          # Calculate SHA256
          $hash = (Get-FileHash -Algorithm SHA256 $archiveName).Hash
          echo "SHA256: $hash"
          echo $hash | Out-File -FilePath "$archiveName.sha256" -NoNewline

          echo "archive_name=$archiveName" >> $env:GITHUB_OUTPUT
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT
        id: create_archive

      - name: Upload to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ steps.create_archive.outputs.archive_name }}
          asset_name: ${{ steps.create_archive.outputs.archive_name }}
          asset_content_type: application/zip

      - name: Upload SHA256 checksum
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ steps.create_archive.outputs.archive_name }}.sha256
          asset_name: ${{ steps.create_archive.outputs.archive_name }}.sha256
          asset_content_type: text/plain

      - name: Upload artifact (for manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: putio-sync-${{ matrix.target }}
          path: |
            ${{ steps.create_archive.outputs.archive_name }}
            ${{ steps.create_archive.outputs.archive_name }}.sha256

  build-summary:
    name: Create Build Summary
    needs: build-windows
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Create summary
        shell: bash
        run: |
          echo "## Windows Binary Builds" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build-windows.result }}" == "success" ]; then
            echo "✅ All Windows builds completed successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Built Targets" >> $GITHUB_STEP_SUMMARY
            echo "- x86_64-pc-windows-msvc (x64)" >> $GITHUB_STEP_SUMMARY
            echo "- aarch64-pc-windows-msvc (ARM64)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some builds failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ github.event_name }}" == "release" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Release Assets" >> $GITHUB_STEP_SUMMARY
            echo "Binaries and checksums uploaded to: ${{ github.event.release.html_url }}" >> $GITHUB_STEP_SUMMARY
          fi
