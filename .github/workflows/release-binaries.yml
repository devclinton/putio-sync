name: Build Release Binaries

# Standalone binaries and installers for every platform (feature 053):
#   Linux x86_64/aarch64  static musl tarballs (Dockerfile.dhi, target binary)
#   macOS arm64           tarball and an unsigned .pkg with a launchd agent
#   Windows x64/arm64     zips (winget installs these) and Inno Setup installers
# and on each, the CLI-only builds (no daemon, API or web UI) as a tarball or
# zip alone: putio-sync-lite (event hooks) and putio-sync-lite-plugins (hooks
# and Lua/WASM plugins),
# plus SHA256SUMS over all of them. release.yml calls it with upload: true; run
# it by hand for a dry run that keeps everything as workflow artifacts:
#   gh workflow run release-binaries.yml -f version=v0.1.2
#
# Secrets: DHI_USERNAME and DHI_TOKEN (a Docker account and access token) to
# pull dhi.io; MACOS_INSTALLER_P12, MACOS_INSTALLER_P12_PASSWORD and
# MACOS_INSTALLER_IDENTITY are optional and sign the .pkg when all are set.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      upload:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v0.1.2)'
        required: true
      upload:
        description: 'Upload to the existing GitHub release with this tag'
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}

jobs:
  build-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to dhi.io
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Build the static binary
        run: |
          docker buildx build -f Dockerfile.dhi --target binary \
            --platform ${{ matrix.platform }} \
            --build-arg PUTIO_SYNC_GIT_SHA=${{ github.sha }} \
            --output type=local,dest=out .

      - name: Check it is static and runs
        run: |
          file out/putio-sync
          # "statically linked", or "static-pie linked" from newer file(1)
          file out/putio-sync | grep -qE 'static(ally|-pie) linked'
          out/putio-sync --version

      - name: Build the static lite binaries
        run: |
          for edition in lite lite-plugins; do
            docker buildx build -f Dockerfile.dhi --target binary \
              --platform ${{ matrix.platform }} \
              --build-arg PUTIO_SYNC_GIT_SHA=${{ github.sha }} \
              --build-arg PUTIO_SYNC_EDITION=$edition \
              --output type=local,dest=out-$edition .
            file out-$edition/putio-sync | grep -qE 'static(ally|-pie) linked'
            out-$edition/putio-sync --version
          done

      - name: Package
        run: |
          mkdir -p dist
          for edition in "" -lite -lite-plugins; do
            name="putio-sync$edition-${VERSION#v}-linux-${{ matrix.arch }}"
            mkdir -p "$name"
            cp "out$edition/putio-sync" LICENSE README.md CHANGELOG.md "$name/"
            tar -czf "dist/$name.tar.gz" "$name"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*

  build-macos:
    name: macOS arm64
    runs-on: macos-latest
    env:
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
    steps:
      - uses: actions/checkout@v4

      # rustup reads the version from rust-toolchain.toml
      - name: Build
        env:
          PUTIO_SYNC_GIT_SHA: ${{ github.sha }}
        run: cargo build --release --locked --target aarch64-apple-darwin --package putio-sync-cli

      - name: Build lite
        env:
          PUTIO_SYNC_GIT_SHA: ${{ github.sha }}
        run: |
          cargo build --release --locked --target aarch64-apple-darwin --package putio-sync-cli \
            --no-default-features --features hooks --target-dir target/lite
          cargo build --release --locked --target aarch64-apple-darwin --package putio-sync-cli \
            --no-default-features --features hooks,plugins --target-dir target/lite-plugins
          target/lite/aarch64-apple-darwin/release/putio-sync --version
          target/lite-plugins/aarch64-apple-darwin/release/putio-sync --version

      - name: Check it runs and links only system libraries
        run: |
          bin=target/aarch64-apple-darwin/release/putio-sync
          "$bin" --version
          otool -L "$bin"
          if otool -L "$bin" | tail -n +2 | grep -v -e '^\s*/usr/lib/' -e '^\s*/System/Library/'; then
            echo "Links a library macOS doesn't ship"; exit 1
          fi

      - name: Import the installer signing identity
        if: env.MACOS_INSTALLER_IDENTITY != ''
        env:
          P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > installer.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import installer.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/productbuild
          rm installer.p12

      - name: Package
        run: |
          bin=target/aarch64-apple-darwin/release/putio-sync
          name="putio-sync-${VERSION#v}-macos-arm64"
          mkdir -p "$name" dist
          cp "$bin" LICENSE README.md CHANGELOG.md "$name/"
          tar -czf "dist/$name.tar.gz" "$name"
          for edition in lite lite-plugins; do
            lite="putio-sync-$edition-${VERSION#v}-macos-arm64"
            mkdir -p "$lite"
            cp "target/$edition/aarch64-apple-darwin/release/putio-sync" LICENSE README.md CHANGELOG.md "$lite/"
            tar -czf "dist/$lite.tar.gz" "$lite"
          done
          bash packaging/macos/build-pkg.sh "$VERSION" "$bin" dist
          pkgutil --payload-files dist/*.pkg
          pkgutil --check-signature dist/*.pkg || echo "Unsigned package"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: dist/*

  build-windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          # Cross-compiled on the x64 runner; MSVC ships the ARM64 tools
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        env:
          PUTIO_SYNC_GIT_SHA: ${{ github.sha }}
          # Link the C runtime in, so the exe runs on a Windows without the
          # Visual C++ Redistributable (winget's clean test machine, say)
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }} --package putio-sync-cli
          cargo build --release --locked --target ${{ matrix.target }} --package putio-sync-cli `
            --no-default-features --features hooks --target-dir target/lite
          cargo build --release --locked --target ${{ matrix.target }} --package putio-sync-cli `
            --no-default-features --features hooks,plugins --target-dir target/lite-plugins

      - name: Check it runs
        if: matrix.arch == 'x64'
        run: |
          target/${{ matrix.target }}/release/putio-sync.exe --version
          target/lite/${{ matrix.target }}/release/putio-sync.exe --version
          target/lite-plugins/${{ matrix.target }}/release/putio-sync.exe --version

      - name: Check it needs no Visual C++ runtime
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          foreach ($exe in "target/${{ matrix.target }}/release/putio-sync.exe", "target/lite/${{ matrix.target }}/release/putio-sync.exe", "target/lite-plugins/${{ matrix.target }}/release/putio-sync.exe") {
            $deps = & $dumpbin.FullName /dependents $exe | Out-String
            $deps
            if ($deps -match '(?i)vcruntime|msvcp|api-ms-win-crt') { throw "$exe still links the Visual C++ runtime" }
          }

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path archive, dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/putio-sync.exe", README.md, LICENSE -Destination archive/
          # winget installs this zip; keep the name and the leading v
          Compress-Archive -Path archive/* -DestinationPath "dist/putio-sync-$env:VERSION-${{ matrix.target }}.zip"
          foreach ($edition in "lite", "lite-plugins") {
            New-Item -ItemType Directory -Force -Path "archive-$edition" | Out-Null
            Copy-Item "target/$edition/${{ matrix.target }}/release/putio-sync.exe", README.md, LICENSE -Destination "archive-$edition/"
            Compress-Archive -Path "archive-$edition/*" -DestinationPath "dist/putio-sync-$edition-$env:VERSION-${{ matrix.target }}.zip"
          }

      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $version = $env:VERSION -replace '^v', ''
          $exe = (Resolve-Path "target/${{ matrix.target }}/release/putio-sync.exe").Path
          iscc "/DAppVersion=$version" "/DArch=${{ matrix.arch }}" "/DSourceExe=$exe" "/O$PWD\dist" packaging/windows/putio-sync.iss

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/*

  checksums:
    name: Checksums and upload
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-all
          path: dist/*

      - name: Upload to the release
        if: inputs.upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$VERSION" dist/* --clobber

      - name: Summary
        run: |
          {
            echo "## Release binaries ${VERSION}"
            echo ""
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
