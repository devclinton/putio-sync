name: Update Homebrew Formula

on:
  # release.yml calls it (feature 053)
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update formula to (e.g., v0.1.1)'
        required: true

permissions:
  contents: read

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version
        id: get_version
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Not a version tag like v1.2.3: $VERSION" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_no_v=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Download release tarball and calculate SHA256
        id: get_sha
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          URL="https://github.com/devclinton/putio-sync/archive/refs/tags/${VERSION}.tar.gz"

          echo "Downloading ${URL}..."
          curl -fsSL "${URL}" -o release.tar.gz

          SHA256=$(sha256sum release.tar.gz | cut -d' ' -f1)
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "SHA256: ${SHA256}"

          rm release.tar.gz

      - name: Checkout tap repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devclinton/homebrew-putio-sync
          # The token is not left in .git/config; the push step passes it explicitly
          persist-credentials: false
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          VERSION_NO_V: ${{ steps.get_version.outputs.version_no_v }}
          SHA256: ${{ steps.get_sha.outputs.sha256 }}
        run: |

          cd homebrew-tap

          # Update the formula file
          sed -i "s|version \".*\"|version \"${VERSION_NO_V}\"|" Formula/putio-sync.rb
          sed -i "s|/tags/v.*\.tar\.gz|/tags/${VERSION}.tar.gz|" Formula/putio-sync.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/putio-sync.rb

          echo "Updated formula:"
          cat Formula/putio-sync.rb

      - name: Commit and push changes
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |

          cd homebrew-tap

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Formula/putio-sync.rb
          git commit \
            -m "Update putio-sync to ${VERSION}" \
            -m "Automated update by GitHub Actions" \
            -m "Release: https://github.com/devclinton/putio-sync/releases/tag/${VERSION}"

          git push "https://x-access-token:${TAP_TOKEN}@github.com/devclinton/homebrew-putio-sync.git" HEAD

      # Syntax check only. Ruby ships on the runner, so no Homebrew installer is
      # fetched (it used to run `curl | bash` in a job that holds the tap token).
      - name: Verify formula syntax
        run: ruby -c homebrew-tap/Formula/putio-sync.rb

      - name: Create update summary
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          SHA256: ${{ steps.get_sha.outputs.sha256 }}
        run: |
          {
            echo "## Homebrew Formula Updated"
            echo ""
            echo "- **Version**: ${VERSION}"
            echo "- **SHA256**: \`${SHA256}\`"
            echo "- **Repository**: [homebrew-putio-sync](https://github.com/devclinton/homebrew-putio-sync)"
            echo ""
            echo "### Installation"
            echo "\`\`\`bash"
            echo "brew tap devclinton/putio-sync"
            echo "brew install putio-sync"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
