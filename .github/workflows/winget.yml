name: Publish to Winget

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., v0.1.1)'
        required: true

jobs:
  winget-publish:
    name: Publish to winget-pkgs
    runs-on: windows-latest
    steps:
      - name: Get version
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $version = "${{ github.event.release.tag_name }}"
          } else {
            $version = "${{ github.event.inputs.version }}"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "version_no_v=$($version -replace '^v', '')" >> $env:GITHUB_OUTPUT

      - name: Publish to winget-pkgs using winget-releaser
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: putio.putio-sync
          version: ${{ steps.get_version.outputs.version }}
          installers-regex: 'putio-sync-.*-windows-.*\.zip$'
          token: ${{ secrets.GITHUB_TOKEN }}
          fork-user: github-actions[bot]
          max-versions-to-keep: 5

      - name: Create submission summary
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.version }}"

          echo "## Winget Submission Created" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Version**: $version" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Package**: putio.putio-sync" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Status**: PR created to microsoft/winget-pkgs" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $env:GITHUB_STEP_SUMMARY
          echo "1. Monitor the PR in [winget-pkgs](https://github.com/microsoft/winget-pkgs/pulls)" >> $env:GITHUB_STEP_SUMMARY
          echo "2. Address any validation errors or review feedback" >> $env:GITHUB_STEP_SUMMARY
          echo "3. Once merged, the package will be available via ``winget install putio.putio-sync``" >> $env:GITHUB_STEP_SUMMARY
