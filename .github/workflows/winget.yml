name: Publish to Winget

on:
  # release.yml calls it (feature 053)
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., v0.1.1)'
        required: true

jobs:
  winget-publish:
    name: Publish to winget-pkgs
    runs-on: windows-latest
    steps:
      - name: Get version
        id: get_version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "version_no_v=$($version -replace '^v', '')" >> $env:GITHUB_OUTPUT

      - name: Publish to winget-pkgs using winget-releaser
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: devclinton.putio-sync
          version: ${{ steps.get_version.outputs.version }}
          installers-regex: 'putio-sync-.*-windows-.*\.zip$'
          # A classic PAT with public_repo: the action forks winget-pkgs into
          # the token owner's account and opens the PR from there
          token: ${{ secrets.WINGET_TOKEN }}
          max-versions-to-keep: 5

      - name: Create submission summary
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.version }}"

          echo "## Winget Submission Created" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Version**: $version" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Package**: devclinton.putio-sync" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Status**: PR created to microsoft/winget-pkgs" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $env:GITHUB_STEP_SUMMARY
          echo "1. Monitor the PR in [winget-pkgs](https://github.com/microsoft/winget-pkgs/pulls)" >> $env:GITHUB_STEP_SUMMARY
          echo "2. Address any validation errors or review feedback" >> $env:GITHUB_STEP_SUMMARY
          echo "3. Once merged, the package will be available via ``winget install devclinton.putio-sync``" >> $env:GITHUB_STEP_SUMMARY
