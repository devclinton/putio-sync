name: CI

# The local gate (`make ci` -> scripts/ci-local.sh) is the source of truth.
# Push/PR runs that same script on one Linux job; the OS matrix and beta
# toolchain only run when triggered manually: gh workflow run ci.yml -f full=true

# Docs-only changes skip CI
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'specs/**'
      - 'Tasks/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'specs/**'
      - 'Tasks/**'
  # Weekly advisory scan: new RustSec advisories land without a code change
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: 'Also run the macOS/Windows matrix and the beta toolchain'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gate:
    name: Gate (Linux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
    # Clippy, the debug test build and the release build together outgrow the
    # runner's free disk. Drop preinstalled SDKs this project never uses.
    - name: Free disk space
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force > /dev/null || true
        df -h /

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The changelog check compares a PR with its base branch
        fetch-depth: 0

    # rustup reads rust-toolchain.toml and installs the pinned version + components
    - name: Install pinned toolchain
      run: rustup show active-toolchain || rustup toolchain install

    - name: Cache cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

    - name: Run local CI gate
      env:
        CHANGELOG_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
      run: bash scripts/ci-local.sh

  matrix:
    name: Check (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install pinned toolchain
      run: rustup show active-toolchain || rustup toolchain install

    - name: Cache cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

    - name: Run tests
      # Report every failing test binary, not just the first
      run: cargo test --all-features --no-fail-fast

  beta:
    name: Check (Rust beta)
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install beta toolchain
      run: rustup toolchain install beta --profile minimal --component clippy

    - name: Cache cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

    # Early warning for lints that will land in the next stable
    - name: Clippy and tests on beta
      run: |
        cargo +beta clippy --all-targets --all-features -- -D warnings
        cargo +beta test --all-features

  # Known advisories with no fix we can take yet (keep in sync with scripts/ci-local.sh):
  #   RUSTSEC-2026-0459  libsqlite3-sys via sqlx 0.8; fixed in 0.39, which needs sqlx 0.9
  #   RUSTSEC-2023-0071  rsa, only reached through sqlx-mysql, which is not compiled
  #   RUSTSEC-2026-0543  chrono is flagged unmaintained; no drop-in replacement yet
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache cargo-audit
      id: cache_audit
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/bin/cargo-audit
        key: cargo-audit-0.23.0

    - name: Install cargo-audit
      if: steps.cache_audit.outputs.cache-hit != 'true'
      run: cargo install cargo-audit --locked --version 0.23.0

    - name: Audit Cargo.lock
      run: cargo audit --deny warnings --ignore RUSTSEC-2026-0459 --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0543
