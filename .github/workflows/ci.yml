name: CI

# The local gate (`make ci` -> scripts/ci-local.sh) is the source of truth.
# Push/PR runs that same script on one Linux job; the OS matrix and beta
# toolchain only run when triggered manually: gh workflow run ci.yml -f full=true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      full:
        description: 'Also run the macOS/Windows matrix and the beta toolchain'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gate:
    name: Gate (Linux)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # The changelog check compares a PR with its base branch
        fetch-depth: 0

    # rustup reads rust-toolchain.toml and installs the pinned version + components
    - name: Install pinned toolchain
      run: rustup show active-toolchain || rustup toolchain install

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Run local CI gate
      env:
        CHANGELOG_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
      run: bash scripts/ci-local.sh

  matrix:
    name: Check (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pinned toolchain
      run: rustup show active-toolchain || rustup toolchain install

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Run tests
      run: cargo test --all-features

  beta:
    name: Check (Rust beta)
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install beta toolchain
      run: rustup toolchain install beta --profile minimal --component clippy

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    # Early warning for lints that will land in the next stable
    - name: Clippy and tests on beta
      run: |
        cargo +beta clippy --all-targets --all-features -- -D warnings
        cargo +beta test --all-features
