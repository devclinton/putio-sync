name: Docker Build and Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    # Docs-only pushes to main skip the build; tag pushes always build
    paths:
      - 'putio-sync-*/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

# Pushes to main build amd64 only (the NAS pulls :main); tags and manual runs
# build the multi-arch image.

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PUTIO_SYNC_GIT_SHA=${{ github.sha }}
            PUTIO_SYNC_IMAGE=ghcr.io/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}

      - name: Build notes
        run: |
          {
            echo "## Docker image"
            echo ""
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/; s/$/`/'
            echo ""
            bash scripts/build-notes.sh "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          } >> $GITHUB_STEP_SUMMARY
