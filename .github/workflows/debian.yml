name: Build Debian Packages

on:
  # release.yml calls it (feature 053)
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      upload:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v0.1.1)'
        required: true

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rust_target: x86_64-unknown-linux-gnu
          - arch: arm64
            rust_target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version
        id: get_version
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Not a version tag like v1.2.3: $VERSION" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_no_v=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev build-essential lintian

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install cross-compilation tools (ARM64 only)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build .deb package
        env:
          VERSION_NO_V: ${{ steps.get_version.outputs.version_no_v }}
          ARCH: ${{ matrix.arch }}
        run: |
          bash packaging/debian/build-deb.sh "$VERSION_NO_V" "$ARCH"

      - name: List built packages
        run: |
          ls -lh build/*.deb
          echo "Package info:"
          dpkg-deb --info build/*.deb

      - name: Upload to release
        if: inputs.upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: gh release upload "$VERSION" build/*.deb build/*.sha256 --clobber

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-${{ matrix.arch }}
          path: |
            build/*.deb
            build/*.sha256

  build-summary:
    name: Create Build Summary
    needs: build-deb
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Create summary
        env:
          BUILD_RESULT: ${{ needs.build-deb.result }}
          UPLOAD: ${{ inputs.upload }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "## Debian Package Builds" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$BUILD_RESULT" == "success" ]; then
            echo "✅ All Debian builds completed successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Built Architectures" >> $GITHUB_STEP_SUMMARY
            echo "- amd64 (x86_64)" >> $GITHUB_STEP_SUMMARY
            echo "- arm64 (aarch64)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Installation" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "# Download the .deb file for your architecture" >> $GITHUB_STEP_SUMMARY
            echo "sudo dpkg -i putio-sync_*_amd64.deb" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "# Or install dependencies if needed" >> $GITHUB_STEP_SUMMARY
            echo "sudo apt-get install -f" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some builds failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$UPLOAD" == "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Release Assets" >> $GITHUB_STEP_SUMMARY
            echo "Packages uploaded to release ${VERSION}" >> $GITHUB_STEP_SUMMARY
          fi
