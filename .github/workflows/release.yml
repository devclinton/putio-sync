name: Release

# The one entry point for a release (feature 053). Pushing a v* tag, or running
# it by hand with a version, creates a draft release, builds every artifact
# into it, then publishes it and updates Homebrew and winget, which need the
# public assets. The other release workflows are reusable (workflow_call) and
# also run by hand for a dry run without touching any release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.2); the tag must exist'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          VERSION="${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          bash scripts/changelog-section.sh "${VERSION#v}" > /tmp/changelog.txt
          [ -s /tmp/changelog.txt ] || echo "Release ${VERSION}" > /tmp/changelog.txt
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION exists; rebuilding its assets"
          else
            gh release create "$VERSION" --draft --verify-tag \
              --title "Release $VERSION" --notes-file /tmp/changelog.txt
          fi

  build-binaries:
    name: Binaries and installers
    needs: create-release
    uses: ./.github/workflows/release-binaries.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      upload: true
    secrets: inherit

  build-debian:
    name: Debian packages
    needs: create-release
    uses: ./.github/workflows/debian.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      upload: true
    secrets: inherit

  build-snap:
    name: Snap (amd64, arm64)
    needs: create-release
    uses: ./.github/workflows/snap.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      channel: stable
    secrets: inherit

  publish-release:
    name: Publish release
    needs: [create-release, build-binaries, build-debian]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.create-release.outputs.version }}" --draft=false --latest

  update-homebrew:
    name: Homebrew formula
    needs: [create-release, publish-release]
    uses: ./.github/workflows/homebrew.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
    secrets: inherit

  publish-winget:
    name: winget
    needs: [create-release, publish-release]
    uses: ./.github/workflows/winget.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
    secrets: inherit

  release-summary:
    name: Release summary
    needs:
      - create-release
      - build-binaries
      - build-debian
      - build-snap
      - publish-release
      - update-homebrew
      - publish-winget
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          status() { [ "$2" = success ] && echo "- ✅ $1" || echo "- ❌ $1 ($2)"; }
          {
            echo "# Release $VERSION"
            echo ""
            status "Binaries and installers (Linux, macOS, Windows) with SHA256SUMS" "${{ needs.build-binaries.result }}"
            status "Debian packages (amd64, arm64)" "${{ needs.build-debian.result }}"
            status "Snap (amd64, arm64)" "${{ needs.build-snap.result }}"
            status "Release published" "${{ needs.publish-release.result }}"
            status "Homebrew formula" "${{ needs.update-homebrew.result }}"
            status "winget submission" "${{ needs.publish-winget.result }}"
            echo ""
            echo "Assets: https://github.com/${{ github.repository }}/releases/tag/${VERSION}"
            echo ""
            echo "Container images build from the same tag in docker.yml and docker-dhi.yml."
          } >> "$GITHUB_STEP_SUMMARY"
