name: Release

# The one entry point for a release (feature 053). Pushing a v* tag, or running
# it by hand with a version, creates a draft release, builds every artifact
# into it, then publishes it and updates Homebrew and winget, which need the
# public assets. The other release workflows are reusable (workflow_call) and
# also run by hand for a dry run without touching any release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.2); the tag must exist'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version
        id: get_version
        env:
          VERSION: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}
        shell: bash
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Not a version tag like v1.2.3: $VERSION" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          bash scripts/changelog-section.sh "${VERSION#v}" > /tmp/changelog.txt
          [ -s /tmp/changelog.txt ] || echo "Release ${VERSION}" > /tmp/changelog.txt
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION exists; rebuilding its assets"
          else
            gh release create "$VERSION" --draft --verify-tag \
              --title "Release $VERSION" --notes-file /tmp/changelog.txt
          fi

  build-binaries:
    name: Binaries and installers
    needs: create-release
    uses: ./.github/workflows/release-binaries.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      upload: true
    secrets:
      DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
      DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
      MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}

  build-debian:
    name: Debian packages
    needs: create-release
    uses: ./.github/workflows/debian.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      upload: true

  build-snap:
    name: Snap (amd64, arm64)
    needs: create-release
    uses: ./.github/workflows/snap.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      channel: stable
    secrets:
      SNAPCRAFT_TOKEN: ${{ secrets.SNAPCRAFT_TOKEN }}

  publish-release:
    name: Publish release
    needs: [create-release, build-binaries, build-debian]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: gh release edit "$VERSION" --draft=false --latest

  update-homebrew:
    name: Homebrew formula
    needs: [create-release, publish-release]
    uses: ./.github/workflows/homebrew.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  publish-winget:
    name: winget
    needs: [create-release, publish-release]
    uses: ./.github/workflows/winget.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
    secrets:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

  release-summary:
    name: Release summary
    needs:
      - create-release
      - build-binaries
      - build-debian
      - build-snap
      - publish-release
      - update-homebrew
      - publish-winget
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          R_BINARIES: ${{ needs.build-binaries.result }}
          R_DEBIAN: ${{ needs.build-debian.result }}
          R_SNAP: ${{ needs.build-snap.result }}
          R_PUBLISH: ${{ needs.publish-release.result }}
          R_HOMEBREW: ${{ needs.update-homebrew.result }}
          R_WINGET: ${{ needs.publish-winget.result }}
          REPO: ${{ github.repository }}
        run: |
          status() { [ "$2" = success ] && echo "- ✅ $1" || echo "- ❌ $1 ($2)"; }
          {
            echo "# Release $VERSION"
            echo ""
            status "Binaries and installers (Linux, macOS, Windows) with SHA256SUMS" "$R_BINARIES"
            status "Debian packages (amd64, arm64)" "$R_DEBIAN"
            status "Snap (amd64, arm64)" "$R_SNAP"
            status "Release published" "$R_PUBLISH"
            status "Homebrew formula" "$R_HOMEBREW"
            status "winget submission" "$R_WINGET"
            echo ""
            echo "Assets: https://github.com/${REPO}/releases/tag/${VERSION}"
            echo ""
            echo "Container images build from the same tag in docker.yml and docker-dhi.yml."
          } >> "$GITHUB_STEP_SUMMARY"
