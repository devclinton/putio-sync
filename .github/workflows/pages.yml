name: Pages

# Builds the project site (landing page + mdBook docs, feature 054) and deploys
# it to GitHub Pages. Pull requests only build and check it.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'site/**'
      - 'README.md'
      - 'INSTALLATION.md'
      - 'PLUGINS.md'
      - 'EVENTS.md'
      - 'CHANGELOG.md'
      - 'snap/gui/putio-sync.png'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'README.md'
      - 'INSTALLATION.md'
      - 'PLUGINS.md'
      - 'EVENTS.md'
      - 'CHANGELOG.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Don't cancel a deployment halfway
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MDBOOK_VERSION: 0.5.4

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # build.sh reads the latest release tag

      - name: Install mdBook
        run: |
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin mdbook
          mdbook --version

      # A tag push names the version; otherwise build.sh uses the latest tag
      - name: Build
        run: site/tools/build.sh

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --offline --include-fragments --no-progress
            --root-dir ${{ github.workspace }}/target/site
            --exclude-path 'docs/([a-zA-Z-]+/)?404\.html'
            'target/site/**/*.html'
          fail: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/tools/package-lock.json

      - name: Check accessibility
        working-directory: site/tools
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run a11y

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: target/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
