name: Build Flatpak

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v0.1.1)'
        required: false

jobs:
  build-flatpak:
    name: Build Flatpak Bundle
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-23.08
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_no_v=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Install Python dependencies
        run: |
          pip3 install aiohttp toml

      - name: Generate cargo sources
        run: |
          # Download flatpak-cargo-generator if not available
          if [ ! -f /usr/share/flatpak-builder/tools/cargo/flatpak-cargo-generator.py ]; then
            curl -o /tmp/flatpak-cargo-generator.py \
              https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
            GENERATOR="/tmp/flatpak-cargo-generator.py"
          else
            GENERATOR="/usr/share/flatpak-builder/tools/cargo/flatpak-cargo-generator.py"
          fi

          # Generate cargo sources
          python3 "$GENERATOR" ./Cargo.lock -o cargo-sources.json

          echo "Generated cargo-sources.json with $(grep -c '"type": "file"' cargo-sources.json) dependencies"

      - name: Update manifest with cargo sources
        run: |
          # Uncomment the cargo-sources.json line
          sed -i 's|# - cargo-sources.json|- cargo-sources.json|' com.putio.PutioSync.yaml

          echo "Updated manifest:"
          grep -A2 "sources:" com.putio.PutioSync.yaml

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: putio-sync.flatpak
          manifest-path: com.putio.PutioSync.yaml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Verify Flatpak bundle
        run: |
          ls -lh putio-sync.flatpak
          echo "Flatpak bundle size: $(du -h putio-sync.flatpak | cut -f1)"

      - name: Upload to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: putio-sync.flatpak
          asset_name: putio-sync-${{ steps.get_version.outputs.version }}.flatpak
          asset_content_type: application/octet-stream

      - name: Upload artifact (for manual runs)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: putio-sync.flatpak

      - name: Create summary
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          SIZE=$(du -h putio-sync.flatpak | cut -f1)

          echo "## Flatpak Package Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "- **File**: putio-sync.flatpak" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: ${SIZE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" = "release" ]; then
            echo "### Installation from Release" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "# Download the Flatpak bundle" >> $GITHUB_STEP_SUMMARY
            echo "wget https://github.com/clintoncollins/putio-sync/releases/download/${VERSION}/putio-sync-${VERSION}.flatpak" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "# Install the bundle" >> $GITHUB_STEP_SUMMARY
            echo "flatpak install --user putio-sync-${VERSION}.flatpak" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "# Run the app" >> $GITHUB_STEP_SUMMARY
            echo "flatpak run com.putio.PutioSync" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Flathub Submission" >> $GITHUB_STEP_SUMMARY
          echo "For Flathub distribution, submit to:" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/flathub/flathub" >> $GITHUB_STEP_SUMMARY
