[package]
name = "putio-sync-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Put.io storage management for putio-sync - storage use, and freeing space by deleting old files that are already downloaded"

[dependencies]
# Internal dependencies
putio-sync-client = { path = "../putio-sync-client" }
putio-sync-core = { path = "../putio-sync-core" }
putio-sync-db = { path = "../putio-sync-db" }
putio-sync-telemetry = { path = "../putio-sync-telemetry" }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Plan ids
uuid = { version = "1.6", features = ["v4"] }

[dev-dependencies]
mockito = "1.2"
tempfile = "3.8"
serde_json = { workspace = true }
