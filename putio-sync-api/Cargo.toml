[package]
name = "putio-sync-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "REST API for putio-sync"

[dependencies]
# Core library (for Config and utilities)
putio-sync-core = { path = "../putio-sync-core" }

# Specialized crates
putio-sync-client = { path = "../putio-sync-client" }
putio-sync-db = { path = "../putio-sync-db" }
putio-sync-doctor = { path = "../putio-sync-doctor" }
putio-sync-hooks = { path = "../putio-sync-hooks" }
putio-sync-plugins = { path = "../putio-sync-plugins" }
putio-sync-download = { path = "../putio-sync-download" }
putio-sync-file-manager = { path = "../putio-sync-file-manager" }
putio-sync-telemetry = { path = "../putio-sync-telemetry" }
putio-sync-arr = { path = "../putio-sync-arr" }
putio-sync-pipeline = { path = "../putio-sync-pipeline" }
putio-sync-precheck = { path = "../putio-sync-precheck" }
putio-sync-storage = { path = "../putio-sync-storage" }
putio-sync-tailscale = { path = "../putio-sync-tailscale" }

# Web framework
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace"] }

# Async runtime
tokio = { workspace = true }
# IPV6_V6ONLY on listeners, so `[::]` and `0.0.0.0` can share a port (feature 037)
socket2 = { version = "0.6", features = ["all"] }

# The Stream behind the Logs page's live tail (SSE, feature 047)
futures-util = "0.3"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
url = "2.5"

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# HTTP client (for testing)
reqwest = { workspace = true }

# Date/time handling
chrono = "0.4"

# Base64 encoding/decoding
base64 = "0.22"

# UUID generation
uuid = { version = "1.6", features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3.8"
reqwest = { workspace = true }
mockito = "1.2"
# Comparing config files in tests
toml = { workspace = true }
sqlx = { workspace = true }
