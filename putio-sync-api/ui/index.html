<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>putio-sync</title>
  <!-- An empty icon stops the browser asking for /favicon.ico, which is not public -->
  <link rel="icon" href="data:,">
  <!-- Applies the saved appearance before first paint -->
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/status">putio-sync</a>
    <button id="find" class="btn btn-quiet find" type="button" aria-label="Search"><span>Search</span><kbd translate="no"></kbd></button>
    <nav id="nav" aria-label="Pages">
      <a href="#/status" data-page="status">Status</a>
      <a href="#/active" data-page="active" data-more>Active</a>
      <a href="#/queue" data-page="queue">Queue</a>
      <a href="#/putio" data-page="putio">Put.io</a>
      <a href="#/files" data-page="files" data-more>Local files</a>
      <a href="#/transfers" data-page="transfers" data-more>Transfers</a>
      <a href="#/history" data-page="history" data-more>History</a>
      <a href="#/stats" data-page="stats" data-more>Stats</a>
      <a href="#/doctor" data-page="doctor" data-more>Doctor</a>
      <a href="#/logs" data-page="logs" data-more>Logs</a>
      <a href="#/settings" data-page="settings">Settings</a>
      <button id="more" class="more" type="button" aria-expanded="false" aria-controls="nav"><span>More</span></button>
    </nav>
    <div class="topbar-end">
      <button id="mode" class="btn btn-quiet mode" type="button" aria-label="Appearance: System"><span>System</span></button>
      <a id="metrics-link" class="muted" hidden>Metrics</a>
      <span id="who" class="muted small" hidden></span>
      <button id="signout" class="btn btn-quiet" type="button" hidden>Sign out</button>
    </div>
  </header>

  <div id="banner" class="banner" role="status" hidden>
    Can't reach putio-sync. It may be restarting. Retrying every 10 seconds; if this lasts, check the container is running and the address is right.
  </div>

  <div id="crash" class="crash-slot"></div>

  <main id="view" tabindex="-1">
    <noscript>
      <p class="notice">This page needs a current browser with JavaScript turned on.</p>
    </noscript>
  </main>

  <div id="toasts" aria-live="polite"></div>

  <dialog id="confirm" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button id="confirm-cancel" class="btn" value="cancel">Cancel</button>
        <button id="confirm-ok" class="btn btn-danger" value="ok">Confirm</button>
      </div>
    </form>
  </dialog>
</body>
</html>
