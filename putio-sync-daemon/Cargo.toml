[package]
name = "putio-sync-daemon"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Daemon orchestrator for putio-sync - coordinates downloads, file watching, and API server"

[dependencies]
# Internal dependencies
putio-sync-client = { path = "../putio-sync-client" }
putio-sync-core = { path = "../putio-sync-core" }
putio-sync-telemetry = { path = "../putio-sync-telemetry" }
putio-sync-db = { path = "../putio-sync-db" }
putio-sync-download = { path = "../putio-sync-download" }
putio-sync-file-manager = { path = "../putio-sync-file-manager" }

# Async runtime
tokio = { workspace = true }

# HTTP client (for API mode)
reqwest = { workspace = true }

# File watching

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Serialization (for config)
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3.8"
mockito = "1.2"
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
