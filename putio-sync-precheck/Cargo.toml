[package]
name = "putio-sync-precheck"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Release pre-check for putio-sync - rejects fake releases from their .torrent file list before they reach Put.io"

[dependencies]
# Internal dependencies
putio-sync-client = { path = "../putio-sync-client" }
putio-sync-core = { path = "../putio-sync-core" }
putio-sync-telemetry = { path = "../putio-sync-telemetry" }

# Async runtime
tokio = { workspace = true }

# HTTP client (.torrent URLs, cache lookups)
reqwest = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Info hash of .torrent files (moved from putio-sync-arr)
sha1 = "0.10"

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
mockito = "1.2"
