{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.putio_sync_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.set_test("wget", {"port": values.network.web_port.port_number, "path": "/health", "busybox": true}) %}

{# The image's user has /config as home; any other uid falls back to / and can't write its logs #}
{% do c1.environment.add_env("HOME", values.consts.config_path) %}
{# Tells the update card and the setup guide link this is the TrueNAS app #}
{% do c1.environment.add_env("PUTIO_SYNC_INSTALL", "truenas") %}
{% do c1.environment.add_env("PUTIO_SYNC_API_BIND", "0.0.0.0:%d"|format(values.network.web_port.port_number)) %}
{% if values.putio_sync.api_token %}
  {% do c1.environment.add_env("PUTIO_SYNC_API_TOKEN", values.putio_sync.api_token) %}
{% endif %}
{% if values.network.metrics_port.bind_mode %}
  {% do c1.environment.add_env("PUTIO_SYNC_METRICS_ENABLED", true) %}
  {% do c1.environment.add_env("PUTIO_SYNC_METRICS_BIND", "0.0.0.0:%d"|format(values.network.metrics_port.port_number)) %}
{% endif %}
{% do c1.environment.add_user_envs(values.putio_sync.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}
{% do c1.add_port(values.network.metrics_port) %}

{% do c1.add_storage(values.consts.config_path, values.storage.config) %}
{% do perm_container.add_or_skip_action("config", values.storage.config, perms_config) %}

{% do c1.add_storage("/downloads", values.storage.downloads) %}
{% do perm_container.add_or_skip_action("downloads", values.storage.downloads, perms_config) %}

{% do c1.add_storage("/watches", values.storage.watches) %}
{% do perm_container.add_or_skip_action("watches", values.storage.watches, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}
{% do tpl.notes.set_body("On first start putio-sync prints a setup code in the app logs. Open the web UI and enter it, or the Web UI Token if you set one.") %}

{{ tpl.render() | tojson }}
