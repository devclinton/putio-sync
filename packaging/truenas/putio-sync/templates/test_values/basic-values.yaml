resources:
  limits:
    cpus: 2.0
    memory: 4096

putio_sync:
  api_token: ""
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080
  metrics_port:
    bind_mode: ""
    port_number: 8081

run_as:
  user: 568
  group: 568

ix_volumes:
  config: /opt/tests/mnt/putio-sync/config
  downloads: /opt/tests/mnt/putio-sync/downloads
  watches: /opt/tests/mnt/putio-sync/watches

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  downloads:
    type: ix_volume
    ix_volume_config:
      dataset_name: downloads
      create_host_path: true
  watches:
    type: ix_volume
    ix_volume_config:
      dataset_name: watches
      create_host_path: true
  additional_storage: []
