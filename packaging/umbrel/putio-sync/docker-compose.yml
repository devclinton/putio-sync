version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: putio-sync_web_1
      APP_PORT: 15432

  web:
    # Pin the multi-arch index digest of the release:
    #   docker buildx imagetools inspect ghcr.io/devclinton/putio-sync:0.3.0
    image: ghcr.io/devclinton/putio-sync:0.3.0@sha256:REPLACE_WITH_RELEASE_DIGEST
    user: "1000:1000"
    restart: on-failure
    environment:
      # 0.2.1 leaves HOME at / for uids other than 99, where logs can't be written.
      HOME: /config
      # Unlocks the setup wizard and the web UI; Umbrel shows it as the app password.
      PUTIO_SYNC_API_TOKEN: ${APP_PASSWORD}
      # Tells the update checker how this install is updated (feature 055)
      PUTIO_SYNC_INSTALL: umbrel
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/watch:/watches
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
