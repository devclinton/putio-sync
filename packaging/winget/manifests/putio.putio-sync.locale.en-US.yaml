ReleaseNotes: |-
  Version 0.1.1

  Fixed:
  - OAuth token exchange now uses GET request instead of POST
  - Updated AccountInfo model to match Put.io API response format
  - Fixed token verification and account info retrieval

  Added:
  - Better error logging for OAuth failures
  - Support for urlencoding in OAuth parameters
