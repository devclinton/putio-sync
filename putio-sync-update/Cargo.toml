[package]
name = "putio-sync-update"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Update checker for putio-sync - finds newer GitHub releases and how to install them"

[dependencies]
putio-sync-core = { path = "../putio-sync-core" }
putio-sync-db = { path = "../putio-sync-db" }
putio-sync-telemetry = { path = "../putio-sync-telemetry" }

# Releases API
reqwest = { workspace = true }

# Schedule and locks
tokio = { workspace = true }

# Releases JSON and the cached state
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3.8"
mockito = "1.2"
