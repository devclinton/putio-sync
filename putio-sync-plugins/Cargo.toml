[package]
name = "putio-sync-plugins"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Lua and WebAssembly plugins for putio-sync - sandboxed scripts run for each event on the internal event bus"

[dependencies]
# Internal dependencies
putio-sync-core = { path = "../putio-sync-core" }
putio-sync-telemetry = { path = "../putio-sync-telemetry" }

# Embedded Lua 5.4, built from source (no system library), with serde conversion
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize"] }

# WebAssembly plugins (029): a pure-Rust interpreter, no JIT, builds for every release target
wasmi = { version = "2", default-features = false, features = ["std", "validate", "auto-dispatch"] }
# Its memory limiter trait's error type, which wasmi does not re-export
wasmi_core = { version = "=2.0.0", default-features = false, features = ["std"] }

# Async runtime (HTTP calls from plugin threads, the dispatcher, the ticker)
tokio = { workspace = true }

# HTTP client for putio.http.request
reqwest = { workspace = true }

# Serialization (manifests, the store, events)
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Logging
tracing = { workspace = true }

# Run timestamps, putio.time.iso
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
# Test modules written as text
wat = "1"
mockito = "1.2"
tempfile = "3.8"
