name = "emby"
version = "1.0.0"
description = "Asks Emby to rescan just the folder of each finished download, so new episodes and movies show up within seconds."
events = ["download.finished", "sync.completed"]
tick_seconds = 5

[permissions]
store = true

[permissions.http]
host_from_config = ["server"]

[[actions]]
id = "load_libraries"
label = "Load libraries"
hidden = true

[[config]]
key = "server"
type = "url"
label = "Server"
help = "Your Emby server, such as http://192.168.1.10:8096"
required = true

[[config]]
key = "api_key"
type = "string"
label = "API key"
help = "Made in Emby's Dashboard › API Keys"
required = true
secret = true

[[config]]
key = "libraries"
type = "string_list"
label = "Libraries"
help = "The libraries to refresh; none ticked refreshes any library that holds the folder"
choices = "load_libraries"

[[config]]
key = "path_map"
type = "path_map"
label = "Path rules"
help = "When Emby sees the download folder under another path: this machine's folder => Emby's folder"

[[config]]
key = "delay_seconds"
type = "integer"
label = "Wait for more files (seconds)"
help = "A folder is refreshed once no file has landed in it for this long (0 to 600)"
default = 20

[[config]]
key = "max_wait_seconds"
type = "integer"
label = "Longest wait (seconds)"
help = "A folder that keeps getting files is refreshed after this long anyway"
default = 300
