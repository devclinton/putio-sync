name = "pushover"
version = "1.0.0"
description = "Push notifications through Pushover. Repeats of one kind are grouped into a summary."
events = ["*"]

[permissions.http]
host_from_config = ["api_url"]

[[config]]
key = "app_token"
type = "string"
label = "Application token"
help = "From your Pushover application"
required = true
secret = true

[[config]]
key = "user_key"
type = "string"
label = "User key"
required = true
secret = true

[[config]]
key = "priority"
type = "integer"
label = "Priority"
help = "-2 (lowest) to 1 (high)"
default = 0

[[config]]
key = "api_url"
type = "url"
label = "API server"
default = "https://api.pushover.net"
required = true

[[config]]
key = "notify"
type = "string_list"
label = "Events"
help = "Event types to send"
default = ["download.finished", "download.failed", "transfer.failed", "sync.completed", "storage.low"]

[[config]]
key = "group_minutes"
type = "integer"
label = "Group repeats for (minutes)"
help = "Later events of the same kind within this time are sent as one summary; 0 sends each"
default = 5
