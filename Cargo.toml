[workspace]
members = [
    "putio-sync-client",
    "putio-sync-db",
    "putio-sync-download",
    "putio-sync-file-manager",
    "putio-sync-daemon",
    "putio-sync-core",
    "putio-sync-cli",
    "putio-sync-api",
    "putio-sync-telemetry",
    "putio-sync-doctor",
    "putio-sync-arr",
    "putio-sync-precheck",
    "putio-sync-storage",
    "putio-sync-tailscale",
    "putio-sync-hooks",
    "putio-sync-plugins",
    "putio-sync-archive",
    "putio-sync-pipeline",
    "putio-sync-subtitles",
    "putio-sync-dlna",
    "putio-sync-translation",
    "putio-sync-update",
    "putio-sync-notify",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
authors = ["Clinton Collins"]
license = "MIT"
repository = "https://github.com/devclinton/putio-sync"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client. rustls instead of the default native-tls (OpenSSL), so release
# binaries link no system TLS library; Mozilla's roots plus the OS store.
reqwest = { version = "0.12", default-features = false, features = [
    "json", "stream", "multipart", "charset", "http2", "macos-system-configuration",
    "rustls-tls", "rustls-tls-native-roots",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Metrics (no default features: no protobuf, no process collector)
prometheus = { version = "0.14", default-features = false }

# Utilities
dirs = "5.0"
sysinfo = "0.31"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"

# thin LTO and one codegen unit for the shipped binaries. Task panics are caught, so
# panic stays "unwind". Debug info is stripped but symbol names stay, so a crash report's
# backtrace (feature 058) shows function names, not addresses.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Proc macros and build scripts are never shipped, so don't strip them. On
# macOS, Command Line Tools' ld-27106 (October 2026) leaves a stripped
# proc-macro dylib that dlopen refuses ("mis-aligned LINKEDIT string pool"),
# which breaks `cargo build --release`. Shipped binaries keep their symbol names.
[profile.release.build-override]
strip = "none"

# Password checks (feature 019) take seconds unoptimised; tests and debug builds check
# passwords too
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
