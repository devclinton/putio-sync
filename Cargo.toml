[workspace]
members = [
    "putio-sync-client",
    "putio-sync-db",
    "putio-sync-download",
    "putio-sync-file-manager",
    "putio-sync-daemon",
    "putio-sync-core",
    "putio-sync-cli",
    "putio-sync-api",
    "putio-sync-telemetry",
    "putio-sync-doctor",
    "putio-sync-arr",
    "putio-sync-precheck",
    "putio-sync-storage",
    "putio-sync-tailscale",
    "putio-sync-hooks",
    "putio-sync-plugins",
    "putio-sync-archive",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["Clinton Collins"]
license = "MIT"
repository = "https://github.com/devclinton/putio-sync"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }

# Metrics (no default features: no protobuf, no process collector)
prometheus = { version = "0.14", default-features = false }

# Utilities
dirs = "5.0"
sysinfo = "0.31"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Proc macros and build scripts are never shipped, so don't strip them. On
# macOS, Command Line Tools' ld-27106 (October 2026) leaves a stripped
# proc-macro dylib that dlopen refuses ("mis-aligned LINKEDIT string pool"),
# which breaks `cargo build --release`. Shipped binaries are still stripped.
[profile.release.build-override]
strip = "none"
