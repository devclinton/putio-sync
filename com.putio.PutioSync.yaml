app-id: com.putio.PutioSync
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: putio-sync

finish-args:
  # Network access for Put.io API
  - --share=network
  # Home directory access for downloads
  - --filesystem=home
  # XDG downloads directory
  - --filesystem=xdg-download
  # Allow access to removable media
  - --filesystem=/media
  - --filesystem=/run/media

modules:
  - name: putio-sync
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/putio-sync/cargo
    build-commands:
      # Build the release binary
      - cargo --offline build --release --package putio-sync-cli
      # Install binary
      - install -Dm755 target/release/putio-sync /app/bin/putio-sync
    sources:
      - type: dir
        path: .
      # Note: cargo-sources.json will be generated by the build script
      # and should be uncommented when building for Flathub
      # - cargo-sources.json
