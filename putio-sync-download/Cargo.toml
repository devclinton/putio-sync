[package]
name = "putio-sync-download"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Download management for putio-sync - streaming downloads and worker pools"

[dependencies]
# Internal dependencies
putio-sync-client = { path = "../putio-sync-client" }
putio-sync-db = { path = "../putio-sync-db" }

# Async runtime
tokio = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Progress tracking
indicatif = "0.17"

# Async utilities
futures-util = "0.3"

# Bytes handling
bytes = "1"

[dev-dependencies]
mockito = "1.2"
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3.8"
tracing-subscriber = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
